<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Família Penha · Site em construção</title>
<meta name="description" content="O site da Família Penha está em construção.">
<link rel="icon" href="/favicon.png">
<style>
  :root { --plum:#2f3a22; --plum2:#4a5a34; --gold:#c59b6c; --cream:#f9f5ef; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         padding:32px 16px; text-align:center; color:var(--cream);
         background:radial-gradient(circle at 50% 30%, var(--plum2), var(--plum) 70%);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  img.logo { width:min(220px,55vw); height:auto; }
  h1 { font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:clamp(28px,6vw,44px); margin:36px 0 12px; }
  p { margin:0 auto; max-width:30em; font-size:clamp(16px,3.6vw,19px); line-height:1.6; opacity:.85; }
  .line { width:80px; height:2px; background:var(--gold); margin:28px auto; border:0; }
  a.btn { display:inline-block; margin-top:8px; padding:14px 26px; border-radius:999px; background:var(--gold);
          color:var(--plum); text-decoration:none; font-weight:600; }
  a.btn:hover { filter:brightness(1.07); }
  footer { margin-top:48px; font-size:14px; opacity:.6; }
</style>
</head>
<body>
  <img class="logo" src="/logo-familia-penha.png" alt="Família Penha">
  <h1>Site em construção</h1>
  <p>Estamos preparando um novo espaço para a nossa família. Em breve, novidades por aqui.</p>
  <hr class="line">
  <p>Enquanto isso, conheça o nosso curso para casais:</p>
  <p><a class="btn" href="/appcasais">Curso de Casais Aliança</a></p>
  <footer>© Família Penha</footer>
</body>
</html>
